name: Cloudsimple
description: CloudSimple was an enterprise software company that ran secure, dedicated VMware
  workloads (VMware Cloud Foundation - vSphere, vSAN, NSX) as a managed service on public clouds,
  originally partnering with Google Cloud and Microsoft Azure. Google Cloud acquired CloudSimple in
  November 2019 and folded the technology into Google Cloud VMware Engine; the standalone company,
  product, and developer surface no longer exist. The former domain (cloudsimple.com) resolves to a
  Google-owned IP but serves no live website, documentation, or API. This profile was surfaced as a
  portfolio company of Mayfield and Redpoint Ventures and remains in the API Evangelist network as a
  historical / defunct-provider record; there is no active API surface to enrich.
